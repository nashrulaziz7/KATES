<!DOCTYPE html>

<head>

    <link rel="icon" href="LOGO.png" type="image/png">
    <link rel="apple-touch-icon" href="LOGO.png">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22KATES%20-%20Kalkulator%20Tes%20Siswa%22%2C%22short_name%22%3A%22KATES%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%233b82f6%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22LOGO.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22any%20maskable%22%7D%2C%7B%22src%22%3A%22LOGO.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');
        
        /* PENGUNCIAN LAYAR PERMANEN */
        html, body {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0; left: 0;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #f0f4f8, #e2e8f0);
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        /* --- ANIMASI MASUK --- */
        @keyframes fade-in-down {
            0% { opacity: 0; transform: translateY(-20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes pop-in {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes slide-up-numpad {
            0% { transform: translateY(100%); }
            100% { transform: translateY(0); }
        }
        
        @keyframes wiggle {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.05) rotate(-5deg); }
            50% { transform: scale(1.05) rotate(5deg); }
            75% { transform: scale(1.05) rotate(-5deg); }
        }

        .anim-header  { animation: fade-in-down 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both; }
        .anim-scores  { animation: pop-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.25s both; }
        .anim-classes { animation: fade-in-up 0.5s ease-out 0.4s both; }
        .anim-toggle  { animation: fade-in-up 0.5s ease-out 0.5s both; }
        .anim-input   { animation: fade-in-up 0.5s ease-out 0.6s both; }
        .anim-numpad  { animation: slide-up-numpad 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.7s both; }
        .anim-wiggle  { animation: wiggle 0.6s ease-in-out; }

        #install-banner {
            transform: translateY(-100%);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #install-banner.show { transform: translateY(0); }

        .subject-bg {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .symbol {
            position: absolute;
            font-weight: 900;
            white-space: nowrap;
            will-change: transform, opacity;
            animation: float-up linear infinite;
            text-shadow: 0 2px 5px rgba(255,255,255,0.8);
        }
        
        @keyframes float-up {
            0% { transform: translateY(110vh) rotate(-15deg) scale(0.8); opacity: 0; }
            15% { opacity: 0.35; } 
            50% { transform: translateY(40vh) rotate(10deg) scale(1.05); opacity: 0.35; }
            85% { opacity: 0.35; } 
            100% { transform: translateY(-15vh) rotate(-10deg) scale(1.15); opacity: 0; }
        }

        .class-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #ffffff;
            color: #64748b;
            border: 1px solid #cbd5e1;
            position: relative;
            overflow: hidden;
        }
        .class-active {
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 8px 20px -6px var(--glow-color);
            color: #ffffff !important;
            border-color: transparent !important;
            animation: breathe 2s ease-in-out infinite;
            z-index: 10;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1.03) translateY(-2px); box-shadow: 0 8px 20px -6px var(--glow-color); }
            50% { transform: scale(1.01) translateY(0px); box-shadow: 0 4px 10px -4px var(--glow-color); }
        }

        @keyframes pulse-warning {
            0%, 100% { transform: scale(1); border-color: #cbd5e1; }
            50% { transform: scale(1.02); border-color: #f43f5e; background-color: #fff1f2; }
        }
        .needs-class .class-btn { animation: pulse-warning 0.5s ease-in-out; }

        @keyframes pop-score {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); color: #3b82f6; }
            100% { transform: scale(1); }
        }
        .pop-effect { animation: pop-score 0.3s ease-out; }

        .numpad-btn:active {
            transform: scale(0.92);
            background-color: #cbd5e1;
        }

        .input-active {
            border: 2px solid #3b82f6 !important;
            background-color: #eff6ff !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center relative w-full h-full">

                <button onclick="tekanTombol('1')" class="numpad-btn bg-slate-50 border border-slate-100 rounded-xl text-xl sm:text-2xl font-bold text-slate-700 transition-colors">1</button>
                <button onclick="tekanTombol('2')" class="numpad-btn bg-slate-50 border border-slate-100 rounded-xl text-xl sm:text-2xl font-bold text-slate-700 transition-colors">2</button>
                <button onclick="tekanTombol('3')" class="numpad-btn bg-slate-50 border border-slate-100 rounded-xl text-xl sm:text-2xl font-bold text-slate-700 transition-colors">3</button>
                
                <button onclick="tekanTombol('4')" class="numpad-btn bg-slate-50 border border-slate-100 rounded-xl text-xl sm:text-2xl font-bold text-slate-700 transition-colors">4</button>
                <button onclick="tekanTombol('5')" class="numpad-btn bg-slate-50 border border-slate-100 rounded-xl text-xl sm:text-2xl font-bold text-slate-700 transition-colors">5</button>
                <button onclick="tekanTombol('6')" class="numpad-btn bg-slate-50 border border-slate-100 rounded-xl text-xl sm:text-2xl font-bold text-slate-700 transition-colors">6</button>
                
                <button onclick="tekanTombol('7')" class="numpad-btn bg-slate-50 border border-slate-100 rounded-xl text-xl sm:text-2xl font-bold text-slate-700 transition-colors">7</button>
                <button onclick="tekanTombol('8')" class="numpad-btn bg-slate-50 border border-slate-100 rounded-xl text-xl sm:text-2xl font-bold text-slate-700 transition-colors">8</button>
                <button onclick="tekanTombol('9')" class="numpad-btn bg-slate-50 border border-slate-100 rounded-xl text-xl sm:text-2xl font-bold text-slate-700 transition-colors">9</button>
                
                <button onclick="tekanTombol('C')" class="numpad-btn bg-red-50 border border-red-100 rounded-xl text-lg font-black text-red-500 transition-colors">C</button>
                <button onclick="tekanTombol('0')" class="numpad-btn bg-slate-50 border border-slate-100 rounded-xl text-xl sm:text-2xl font-bold text-slate-700 transition-colors">0</button>
                <button onclick="tekanTombol('DEL')" class="numpad-btn bg-slate-100 border border-slate-200 rounded-xl text-lg font-bold text-slate-600 transition-colors flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 sm:h-6 sm:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z" />
                    </svg>
                </button>
            </div>
        </div>

    </div>

    <script>
        let deferredPrompt;
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Setup:', err));
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            setTimeout(() => { document.getElementById('install-banner').classList.add('show'); }, 1500); 
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    deferredPrompt = null;
                    tutupBanner();
                });
            }
        }
        function tutupBanner() { document.getElementById('install-banner').classList.remove('show'); }
        function refreshApp() { window.location.href = window.location.pathname + '?v=' + new Date().getTime(); }

        // --- SISTEM KONFIGURASI DINAMIS (FITUR RAHASIA) ---
        // Konfigurasi Default Pabrik
        const defaultConfig = {
            'btn1': { label: 'KLS 1', pembagi: 55, maxR1: 20, maxR2: 10, maxR3: 5, color: 'bg-blue-500' },
            'btn2': { label: 'KLS 2-3', pembagi: 60, maxR1: 25, maxR2: 10, maxR3: 5, color: 'bg-emerald-500' },
            'btn3': { label: 'KLS 4-5', pembagi: 65, maxR1: 30, maxR2: 10, maxR3: 5, color: 'bg-rose-500' },
            'btn4': { label: 'KODING', pembagi: 45, maxR1: 15, maxR2: 30, maxR3: 0, color: 'bg-purple-500' } 
        };

        let configKelas = JSON.parse(JSON.stringify(defaultConfig)); // Salin dari default
        
        // Memuat custom config dari HP guru (Jika ada)
        function loadCustomConfig() {
            try {
                const savedConfig = localStorage.getItem('kates_config_custom');
                if(savedConfig) configKelas = JSON.parse(savedConfig);
            } catch(e){}
            renderTombolKelas();
        }

        // Merender label dan pembagi ke UI secara dinamis
        function renderTombolKelas() {
            ['btn1', 'btn2', 'btn3', 'btn4'].forEach(key => {
                const cfg = configKelas[key];
                document.getElementById('label-' + key).innerText = cfg.label;
                document.getElementById('pembagi-' + key).innerText = 'Bagi ' + cfg.pembagi;
            });
        }

        // --- FITUR TEKAN LAMA (LONG PRESS) ZIVI AI ---
        let ziviTimer;
        const ziviBtn = document.getElementById('zivi-ai-btn');
        
        const startZiviPress = (e) => {
            // Aktifkan getaran HP jika disupport
            if (navigator.vibrate) navigator.vibrate(50);
            ziviTimer = setTimeout(() => {
                bukaSettings();
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]); // Getar berhasil masuk
            }, 1500); // 1.5 detik
        };
        const cancelZiviPress = () => { clearTimeout(ziviTimer); };

        ziviBtn.addEventListener('touchstart', startZiviPress, {passive: true});
        ziviBtn.addEventListener('touchend', cancelZiviPress);
        ziviBtn.addEventListener('mousedown', startZiviPress);
        ziviBtn.addEventListener('mouseup', cancelZiviPress);
        ziviBtn.addEventListener('mouseleave', cancelZiviPress);
        // Cegah klik kanan di laptop
        ziviBtn.addEventListener('contextmenu', e => e.preventDefault());

        // --- LOGIKA POPUP PENGATURAN ---
        function bukaSettings() {
            loadSettingsForm(); // Muat data tombol 1
            const popup = document.getElementById('settings-popup');
            const box = document.getElementById('settings-popup-box');
            popup.classList.remove('opacity-0', 'pointer-events-none');
            popup.classList.add('opacity-100');
            setTimeout(() => {
                box.classList.remove('scale-95', 'opacity-0');
                box.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function tutupSettings() {
            const popup = document.getElementById('settings-popup');
            const box = document.getElementById('settings-popup-box');
            box.classList.remove('scale-100', 'opacity-100');
            box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                popup.classList.remove('opacity-100');
                popup.classList.add('opacity-0', 'pointer-events-none');
            }, 300);
        }

        function loadSettingsForm() {
            const key = document.getElementById('edit-select').value;
            const cfg = configKelas[key];
            document.getElementById('edit-label').value = cfg.label;
            document.getElementById('edit-pembagi').value = cfg.pembagi;
            document.getElementById('edit-r1').value = cfg.maxR1;
            document.getElementById('edit-r2').value = cfg.maxR2;
            
            const r3Container = document.getElementById('r3-container');
            if (key === 'btn4') {
                r3Container.classList.add('opacity-30', 'pointer-events-none');
                document.getElementById('edit-r3').value = 0;
            } else {
                r3Container.classList.remove('opacity-30', 'pointer-events-none');
                document.getElementById('edit-r3').value = cfg.maxR3;
            }
        }

        function simpanSettings() {
            const key = document.getElementById('edit-select').value;
            configKelas[key].label = document.getElementById('edit-label').value || 'KELAS';
            configKelas[key].pembagi = parseInt(document.getElementById('edit-pembagi').value) || 1;
            configKelas[key].maxR1 = parseInt(document.getElementById('edit-r1').value) || 0;
            configKelas[key].maxR2 = parseInt(document.getElementById('edit-r2').value) || 0;
            if (key !== 'btn4') {
                configKelas[key].maxR3 = parseInt(document.getElementById('edit-r3').value) || 0;
            }

            // Simpan Ke Memori HP
            localStorage.setItem('kates_config_custom', JSON.stringify(configKelas));
            
            renderTombolKelas();
            tutupSettings();
            
            // Jika tombol yang diedit sedang aktif, refresh nilai
            if(activeKelas === key) {
                pilihKelas(key);
            } else if (activeKelas) {
                pilihKelas(activeKelas); // reload max text
            }
        }

        function resetSettingsFactory() {
            if(confirm("Yakin ingin mengembalikan semua batas nilai kelas ke aturan awal/pabrik?")) {
                configKelas = JSON.parse(JSON.stringify(defaultConfig));
                localStorage.removeItem('kates_config_custom');
                renderTombolKelas();
                tutupSettings();
                resetGlobal();
            }
        }

        // --- VARIABEL STATUS KALKULATOR ---
        let activeKelas = null; // Menyimpan KEY ('btn1', 'btn2', dll)
        let activeMode = 'jumlah'; 
        let fokusInput = 'total';
        let nilaiInput = { r1: '', r2: '', r3: '', total: '' };
        let popupTimeout;

        // --- POPUP PERINGATAN LUCU ---
        function tampilkanPeringatanLucu(tipe, maxVal = 0) {
            const popup = document.getElementById('cute-popup');
            const box = document.getElementById('cute-popup-box');
            const emojiEl = document.getElementById('popup-emoji');
            const titleEl = document.getElementById('popup-title');
            const msgEl = document.getElementById('popup-message');
            const maxBox = document.getElementById('popup-max-box');
            
            if (tipe === 'nokelas') {
                const variasi = [
                    { emoji: '🗿', title: 'Woi Bangun!', msg: 'Pilih kelas dulu ngab!' },
                    { emoji: '☕', title: 'Cuci Muka Dulu!', msg: 'Kelasnya belum dipencet tuh~' },
                    { emoji: '✋', title: 'Eits, Sabar!', msg: 'Gas terus, pilih kelas dulu dong bestie!' },
                    { emoji: '🙈', title: 'Main Pencet Aja', msg: 'Kelasnya mana woy? Lupa ya?' },
                    { emoji: '🤣', title: 'Ngopi Duls!', msg: 'Fokus! Jangan lupa klik kelasnya~' }
                ];
                const rand = variasi[Math.floor(Math.random() * variasi.length)];
                
                emojiEl.innerText = rand.emoji;
                titleEl.innerText = rand.title;
                titleEl.className = 'text-amber-500 font-black text-2xl mb-1';
                msgEl.innerHTML = rand.msg;
                
                maxBox.classList.add('hidden');
                box.className = 'relative bg-white rounded-[2rem] p-6 shadow-2xl transform scale-50 opacity-0 transition-all duration-300 max-w-[280px] w-4/5 text-center border-4 border-amber-300 flex flex-col items-center';
                
            } else if (tipe === 'over') {
                const variasi = [
                    { emoji: '🤯', title: 'Kelebihan!!', msg: 'Santai bre, angkanya nembus batas!' },
                    { emoji: '🤣', title: 'Ngantuk lu ya bre?', msg: 'Waduh, kebanyakan ngetik tuh!' },
                    { emoji: '🐲', title: 'Astaga Naga!', msg: 'Muridnya dapet nilai bonus kah?' },
                    { emoji: '🫣', title: 'Guru Sapa Nih?', msg: 'Lebih dari batas maksimal woy!' },
                    { emoji: '💸', title: 'Lagi Diskon?', msg: 'Nilainya diobral ya bu/pak? Kelebihan!' }
                ];
                const rand = variasi[Math.floor(Math.random() * variasi.length)];

                emojiEl.innerText = rand.emoji;
                titleEl.innerText = rand.title;
                titleEl.className = 'text-rose-500 font-black text-2xl mb-1';
                msgEl.innerHTML = rand.msg;
                
                maxBox.classList.remove('hidden');
                document.getElementById('popup-max-val').innerText = maxVal;
                box.className = 'relative bg-white rounded-[2rem] p-6 shadow-2xl transform scale-50 opacity-0 transition-all duration-300 max-w-[280px] w-4/5 text-center border-4 border-rose-300 flex flex-col items-center';
            }

            popup.classList.remove('opacity-0', 'pointer-events-none');
            popup.classList.add('opacity-100');
            
            setTimeout(() => {
                box.classList.remove('scale-50', 'opacity-0');
                box.classList.add('scale-100', 'opacity-100', 'anim-wiggle');
            }, 10);

            clearTimeout(popupTimeout);
            popupTimeout = setTimeout(() => { tutupPeringatanLucu(); }, 3500);
        }

        function tutupPeringatanLucu() {
            const popup = document.getElementById('cute-popup');
            const box = document.getElementById('cute-popup-box');
            box.classList.remove('scale-100', 'opacity-100', 'anim-wiggle');
            box.classList.add('scale-50', 'opacity-0');
            setTimeout(() => {
                popup.classList.remove('opacity-100');
                popup.classList.add('opacity-0', 'pointer-events-none');
            }, 300);
        }

        function simpanDataOffline() {
            const data = { activeKelas, activeMode, fokusInput, nilaiInput };
            localStorage.setItem('kates_offline_data', JSON.stringify(data));
        }

        function muatDataOffline() {
            try {
                const data = JSON.parse(localStorage.getItem('kates_offline_data'));
                if (data && data.activeKelas) {
                    nilaiInput = data.nilaiInput || { r1: '', r2: '', r3: '', total: '' };
                    setMode(data.activeMode || 'jumlah');
                    pilihKelas(data.activeKelas);
                    setFokus(data.fokusInput || 'total');
                    return true;
                }
            } catch (e) {}
            return false;
        }

        function initMathBg() {
            const bg = document.getElementById('mathBg');
            const symbols = ['🕌', '☀️', '🦅', '📚', '🔬', '📐', '⚽', '🎨', '💻', '🎭', 'ا', '🕋']; 
            for(let i = 0; i < 10; i++) {
                let el = document.createElement('div');
                el.className = 'symbol';
                el.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                el.style.left = `${Math.random() * 100}vw`;
                el.style.animationDuration = `${12 + Math.random() * 10}s`;
                el.style.animationDelay = `-${Math.random() * 15}s`; 
                el.style.fontSize = `${2 + Math.random() * 2}rem`; 
                bg.appendChild(el);
            }
        }

        // --- FUNGSI KALKULATOR ---
        function resetGlobal() {
            activeKelas = null;
            document.getElementById('area-kelas').classList.remove('needs-class');
            nilaiInput = { r1: '', r2: '', r3: '', total: '' };

            ['btn1', 'btn2', 'btn3', 'btn4'].forEach(k => {
                const btn = document.getElementById('btn-' + k);
                btn.className = btn.className.replace(/bg-\w+-500/g, 'bg-white');
                btn.classList.remove('class-active');
            });

            const viewRomawi = document.getElementById('view-romawi');
            const boxR3 = document.getElementById('box-r3');
            const labelR2 = document.getElementById('label-r2');
            
            viewRomawi.classList.replace('grid-cols-2', 'grid-cols-3');
            boxR3.classList.remove('hidden');
            labelR2.innerText = 'ROM II (x2)'; 

            document.getElementById('max-r1').innerText = 'Maks: ?';
            document.getElementById('max-r2').innerText = 'Maks: ?';
            document.getElementById('max-r3').innerText = 'Maks: ?';
            document.getElementById('max-total').innerText = 'Maks: ?';
            
            updateTampilan();
            setMode('jumlah'); 

            document.getElementById('nilaiAsli').innerText = '0.00';
            document.getElementById('nilaiBulat').innerText = '0';
            
            const gifEl = document.getElementById('gif-reaction');
            gifEl.classList.remove('scale-100');
            gifEl.classList.add('scale-0');
            gifEl.innerHTML = '';
            simpanDataOffline();
        }

        function pilihKelas(kelasKey) {
            activeKelas = kelasKey;
            const cfg = configKelas[kelasKey];
            
            document.getElementById('area-kelas').classList.remove('needs-class');
            nilaiInput = { r1: '', r2: '', r3: '', total: '' };

            ['btn1', 'btn2', 'btn3', 'btn4'].forEach(k => {
                const btn = document.getElementById('btn-' + k);
                btn.className = btn.className.replace(/bg-\w+-500/g, 'bg-white');
                btn.classList.remove('class-active');
            });

            const activeBtn = document.getElementById('btn-' + kelasKey);
            activeBtn.classList.remove('bg-white');
            activeBtn.classList.add(cfg.color, 'class-active');

            const viewRomawi = document.getElementById('view-romawi');
            const boxR3 = document.getElementById('box-r3');
            const labelR2 = document.getElementById('label-r2');

            if (kelasKey === 'btn4') { // Koding
                viewRomawi.classList.replace('grid-cols-3', 'grid-cols-2');
                boxR3.classList.add('hidden');
                labelR2.innerText = 'ROM II (x1)'; 
                if (fokusInput === 'r3') setFokus('r2');
            } else {
                viewRomawi.classList.replace('grid-cols-2', 'grid-cols-3');
                boxR3.classList.remove('hidden');
                labelR2.innerText = 'ROM II (x2)'; 
            }

            document.getElementById('max-r1').innerText = 'Maks: ' + cfg.maxR1;
            document.getElementById('max-r2').innerText = 'Maks: ' + cfg.maxR2;
            if (kelasKey !== 'btn4') {
                document.getElementById('max-r3').innerText = 'Maks: ' + cfg.maxR3;
            }
            document.getElementById('max-total').innerText = 'Maks: ' + cfg.pembagi;
            
            validasiNilai();
            updateTampilan();
            kalkulasi();
            simpanDataOffline();
        }

        function setMode(mode) {
            activeMode = mode;
            const tRomawi = document.getElementById('tab-romawi');
            const tJumlah = document.getElementById('tab-jumlah');
            
            if(mode === 'romawi') {
                tRomawi.className = "flex-1 py-1 rounded-full text-[11px] font-bold transition-all bg-indigo-500 text-white shadow-md";
                tJumlah.className = "flex-1 py-1 rounded-full text-[11px] font-bold transition-all text-slate-500 bg-transparent";
                document.getElementById('view-romawi').classList.remove('hidden');
                document.getElementById('view-romawi').classList.add('grid');
                document.getElementById('view-jumlah').classList.add('hidden');
                document.getElementById('view-jumlah').classList.remove('flex');
                setFokus('r1'); 
            } else {
                tJumlah.className = "flex-1 py-1 rounded-full text-[11px] font-bold transition-all bg-amber-400 text-slate-800 shadow-md";
                tRomawi.className = "flex-1 py-1 rounded-full text-[11px] font-bold transition-all text-slate-500 bg-transparent";
                document.getElementById('view-jumlah').classList.remove('hidden');
                document.getElementById('view-jumlah').classList.add('flex');
                document.getElementById('view-romawi').classList.add('hidden');
                document.getElementById('view-romawi').classList.remove('grid');
                setFokus('total'); 
            }
            kalkulasi();
            simpanDataOffline();
        }

        function setFokus(idBox) {
            fokusInput = idBox;
            ['r1', 'r2', 'r3', 'total'].forEach(id => {
                const el = document.getElementById('box-' + id);
                if(el) el.classList.remove('input-active');
            });
            document.getElementById('box-' + idBox).classList.add('input-active');
        }

        function tekanTombol(kunci) {
            if (!activeKelas) {
                const areaKelas = document.getElementById('area-kelas');
                areaKelas.classList.remove('needs-class');
                void areaKelas.offsetWidth; 
                areaKelas.classList.add('needs-class');
                tampilkanPeringatanLucu('nokelas');
                return;
            }

            let strCurrent = nilaiInput[fokusInput];

            if (kunci === 'C') {
                strCurrent = '';
            } else if (kunci === 'DEL') {
                strCurrent = strCurrent.slice(0, -1);
            } else {
                if(strCurrent === '0' && kunci === '0') return;
                strCurrent += kunci;
            }

            nilaiInput[fokusInput] = strCurrent;
            validasiNilai();
            updateTampilan();
            kalkulasi();
            simpanDataOffline();
        }

        function validasiNilai() {
            if(!activeKelas) return;
            const valNum = parseInt(nilaiInput[fokusInput]);
            if(isNaN(valNum)) return;

            const cfg = configKelas[activeKelas];
            let maxAllow = 0;
            
            if(fokusInput === 'r1') maxAllow = cfg.maxR1;
            if(fokusInput === 'r2') maxAllow = cfg.maxR2;
            if(fokusInput === 'r3') maxAllow = cfg.maxR3;
            if(fokusInput === 'total') maxAllow = cfg.pembagi;

            if(valNum > maxAllow) {
                // KOSONGKAN NILAI JIKA MELEBIHI BATAS
                nilaiInput[fokusInput] = '';
                tampilkanPeringatanLucu('over', maxAllow);
            }
        }

        function updateTampilan() {
            document.getElementById('disp-r1').innerText = nilaiInput.r1;
            document.getElementById('disp-r2').innerText = nilaiInput.r2;
            document.getElementById('disp-r3').innerText = nilaiInput.r3;
            document.getElementById('disp-total').innerText = nilaiInput.total;
        }

        function kalkulasi() {
            if (!activeKelas) return;
            
            const cfg = configKelas[activeKelas];
            let pembagi = cfg.pembagi;
            let totalSkor = 0;

            if (activeMode === 'romawi') {
                let r1 = parseInt(nilaiInput.r1) || 0;
                let r2 = parseInt(nilaiInput.r2) || 0;
                let r3 = parseInt(nilaiInput.r3) || 0;
                
                if (activeKelas === 'btn4') { // Koding
                    totalSkor = (r1 * 1) + (r2 * 1);
                } else {
                    totalSkor = (r1 * 1) + (r2 * 2) + (r3 * 3);
                }
            } else {
                totalSkor = parseFloat(nilaiInput.total) || 0;
            }

            let nilaiAkhir = (totalSkor * 100) / pembagi;
            
            let valAsli = isNaN(nilaiAkhir) ? 0 : nilaiAkhir;
            let strAsli = valAsli.toFixed(2);
            if(strAsli.endsWith('.00')) strAsli = valAsli.toString();
            let valBulat = Math.round(valAsli);
            let strBulat = valBulat.toString();

            const elAsli = document.getElementById('nilaiAsli');
            const elBulat = document.getElementById('nilaiBulat');

            if(elAsli.innerText !== strAsli) {
                elAsli.innerText = strAsli;
                elBulat.innerText = strBulat;
                
                elAsli.classList.remove('pop-effect');
                elBulat.classList.remove('pop-effect');
                void elAsli.offsetWidth; 
                elAsli.classList.add('pop-effect');
                elBulat.classList.add('pop-effect');
            }

            const gifEl = document.getElementById('gif-reaction');
            if (totalSkor === 0 || !activeKelas) {
                gifEl.classList.remove('scale-100');
                gifEl.classList.add('scale-0');
            } else {
                gifEl.classList.remove('scale-0');
                gifEl.classList.add('scale-100');
                
                if (valBulat < 70) {
                    gifEl.innerHTML = '<img src="sedih.gif" alt="sedih" class="w-full h-full object-contain">';
                } else if (valBulat >= 70 && valBulat <= 85) {
                    gifEl.innerHTML = '<img src="senyum.gif" alt="senyum" class="w-full h-full object-contain">';
                } else if (valBulat > 85) {
                    gifEl.innerHTML = '<img src="bahagia.gif" alt="bahagia" class="w-full h-full object-contain">';
                }
            }
        }

        document.addEventListener('keydown', function(e) {
            const key = e.key;
            if (/^[0-9]$/.test(key)) {
                tekanTombol(key);
            } else if (key === 'Backspace') {
                tekanTombol('DEL');
            } else if (key.toLowerCase() === 'c' || key === 'Delete' || key === 'Escape') {
                tekanTombol('C');
            }
        });

        // 1. Eksekusi Background
        initMathBg();
        // 2. Muat Custom Config dari Memori Lokal HP
        loadCustomConfig();
        // 3. Muat State Terakhir / Default
        if (!muatDataOffline()) {
            setMode('jumlah');
        }

    </script>
</body>
</html>
