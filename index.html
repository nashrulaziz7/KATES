<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KATES - Kalkulator Tes Siswa</title>
    
    <!-- Icon & PWA Manifest Inline untuk GitHub Pages menggunakan LOGO.png -->
    <link rel="icon" href="LOGO.png" type="image/png">
    <link rel="apple-touch-icon" href="LOGO.png">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22KATES%20-%20Kalkulator%20Tes%20Siswa%22%2C%22short_name%22%3A%22KATES%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%233b82f6%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22LOGO.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22any%20maskable%22%7D%2C%7B%22src%22%3A%22LOGO.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            overflow: hidden; /* Mutlak tanpa scroll */
            background: linear-gradient(135deg, #f0f4f8, #e2e8f0);
            touch-action: manipulation; /* Cegah double-tap zoom di HP */
            -webkit-user-select: none;
            user-select: none;
        }

        /* --- ANIMASI MASUK (ENTRANCE ANIMATIONS) --- */
        @keyframes fade-in-down {
            0% { opacity: 0; transform: translateY(-20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes pop-in {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes slide-up-numpad {
            0% { transform: translateY(100%); }
            100% { transform: translateY(0); }
        }

        /* Kelas penanda animasi urut (staggered) */
        .anim-header  { animation: fade-in-down 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both; }
        .anim-scores  { animation: pop-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.25s both; }
        .anim-classes { animation: fade-in-up 0.5s ease-out 0.4s both; }
        .anim-toggle  { animation: fade-in-up 0.5s ease-out 0.5s both; }
        .anim-input   { animation: fade-in-up 0.5s ease-out 0.6s both; }
        .anim-numpad  { animation: slide-up-numpad 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.7s both; }

        /* Banner Install PWA Animasi */
        #install-banner {
            transform: translateY(-100%);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #install-banner.show {
            transform: translateY(0);
        }

        /* Latar Belakang Animasi Pelajaran */
        .subject-bg {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .symbol {
            position: absolute;
            font-weight: 900;
            white-space: nowrap;
            will-change: transform, opacity;
            animation: float-up linear infinite;
            text-shadow: 0 2px 5px rgba(255,255,255,0.8);
        }
        
        /* Animasi Mengayun Halus */
        @keyframes float-up {
            0% { transform: translateY(110vh) rotate(-15deg) scale(0.8); opacity: 0; }
            15% { opacity: 0.35; } /* Opacity ditingkatkan agar lebih terlihat */
            50% { transform: translateY(40vh) rotate(10deg) scale(1.05); opacity: 0.35; }
            85% { opacity: 0.35; } 
            100% { transform: translateY(-15vh) rotate(-10deg) scale(1.15); opacity: 0; }
        }

        /* Tombol Kelas & Efek Aktif */
        .class-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #ffffff;
            color: #64748b;
            border: 1px solid #cbd5e1;
            position: relative;
            overflow: hidden;
        }
        .class-active {
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 8px 20px -6px var(--glow-color);
            color: #ffffff !important;
            border-color: transparent !important;
            animation: breathe 2s ease-in-out infinite;
            z-index: 10;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1.03) translateY(-2px); box-shadow: 0 8px 20px -6px var(--glow-color); }
            50% { transform: scale(1.01) translateY(0px); box-shadow: 0 4px 10px -4px var(--glow-color); }
        }

        /* Peringatan ketika kelas belum dipilih */
        @keyframes pulse-warning {
            0%, 100% { transform: scale(1); border-color: #cbd5e1; }
            50% { transform: scale(1.02); border-color: #f43f5e; background-color: #fff1f2; }
        }
        .needs-class .class-btn {
            animation: pulse-warning 0.5s ease-in-out;
        }

        /* Efek Pop saat nilai berubah */
        @keyframes pop-score {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); color: #3b82f6; }
            100% { transform: scale(1); }
        }
        .pop-effect { animation: pop-score 0.3s ease-out; }

        /* Numpad Button Press Effect */
        .numpad-btn:active {
            transform: scale(0.92);
            background-color: #cbd5e1;
        }

        /* Kolom Input Aktif */
        .input-active {
            border: 2px solid #3b82f6 !important;
            background-color: #eff6ff !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col items-center justify-center relative">
    
    <!-- Banner Install Aplikasi (PWA) -->
    <div id="install-banner" class="fixed top-0 left-0 w-full z-50 bg-blue-600 text-white p-3 flex justify-between items-center shadow-lg rounded-b-2xl">
        <div class="flex items-center gap-3 pl-2">
            <!-- Icon App di Banner Menggunakan LOGO.png -->
            <img src="LOGO.png" alt="Logo" class="w-10 h-10 object-contain drop-shadow-md rounded-xl bg-white/20 p-1">
            <div class="flex flex-col">
                <span class="text-sm font-black tracking-wide">Install KATES</span>
                <span class="text-[10px] opacity-90 font-medium">Buka lebih cepat & tanpa internet!</span>
            </div>
        </div>
        <div class="flex gap-2 items-center pr-1">
            <button onclick="installApp()" class="bg-white text-blue-600 text-[11px] font-bold px-4 py-2 rounded-full shadow-md active:scale-95 transition-transform uppercase tracking-wider">Install</button>
            <button onclick="tutupBanner()" class="text-white/80 hover:text-white px-2 text-2xl font-black">&times;</button>
        </div>
    </div>

    <!-- Background Animasi Pelajaran -->
    <div class="subject-bg" id="mathBg"></div>

    <div class="relative z-10 w-full max-w-sm h-full flex flex-col p-2 sm:p-3 mx-auto">
        
        <!-- Header: Judul KATES (Animasi 1) -->
        <div class="flex-shrink-0 text-center mb-1 mt-1 anim-header relative">
            
            <!-- Tombol Reset Cepat -->
            <button onclick="resetGlobal()" class="absolute top-0 right-1 bg-white/60 backdrop-blur-md border border-slate-200 text-rose-500 p-1.5 rounded-full shadow-sm hover:bg-rose-50 active:scale-90 transition-all z-50 flex items-center justify-center" title="Reset Semua">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>

            <p class="text-[9px] uppercase tracking-[0.2em] text-blue-600 font-bold opacity-80 mb-0.5">By Zivi•Ai</p>
            <img src="JUDUL.png" alt="KATES" class="h-16 sm:h-20 object-contain mx-auto my-1 drop-shadow-[0_2px_2px_rgba(0,0,0,0.2)]">
            <p class="text-[11px] font-extrabold text-slate-500 tracking-widest mt-0.5">-KALKULATOR TES SISWA-</p>
        </div>

        <!-- Display Box (Paling Atas) (Animasi 2) -->
        <div class="flex-shrink-0 w-full mb-2 flex items-center justify-between gap-2 relative anim-scores">
            
            <!-- Kiri: Nilai Asli -->
            <div class="flex flex-col items-center flex-1 bg-gradient-to-br from-blue-50 to-blue-100 rounded-2xl py-2 px-1 border-2 border-blue-300 shadow-sm relative overflow-hidden">
                <p class="text-[9px] text-blue-600 font-bold tracking-widest uppercase mb-0.5 relative z-10">Nilai Asli</p>
                <div class="text-3xl font-black text-blue-700 tabular-nums transition-all relative z-10" id="nilaiAsli">0.00</div>
            </div>

            <!-- GIF REAKSI TENGAH -->
            <div id="gif-reaction" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-20 transition-all duration-300 scale-0 pointer-events-none drop-shadow-lg flex items-center justify-center w-24 h-24 sm:w-28 sm:h-28">
                <!-- GIF akan diisi oleh JS -->
            </div>
            
            <!-- Kanan: Pembulatan -->
            <div class="flex flex-col items-center flex-1 bg-gradient-to-br from-orange-50 to-orange-100 rounded-2xl py-2 px-1 border-2 border-orange-300 shadow-sm relative overflow-hidden">
                <p class="text-[9px] text-orange-600 font-bold tracking-widest uppercase mb-0.5 relative z-10">Pembulatan</p>
                <div class="text-4xl font-black text-orange-700 tabular-nums transition-all relative z-10" id="nilaiBulat">0</div>
            </div>
        </div>

        <!-- Pilihan Kelas (Animasi 3) -->
        <div class="flex-shrink-0 mb-2 anim-classes" id="area-kelas">
            <div class="grid grid-cols-3 gap-1 mb-1">
                <button onclick="pilihKelas('55')" id="btn-55" style="--glow-color: rgba(59,130,246,0.4)" class="class-btn rounded-xl py-2 flex flex-col items-center justify-center">
                    <span class="text-xs font-black">KLS 1</span>
                    <span class="text-[8px] font-bold opacity-80">Bagi 55</span>
                </button>
                <button onclick="pilihKelas('60')" id="btn-60" style="--glow-color: rgba(16,185,129,0.4)" class="class-btn rounded-xl py-2 flex flex-col items-center justify-center">
                    <span class="text-xs font-black">KLS 2-3</span>
                    <span class="text-[8px] font-bold opacity-80">Bagi 60</span>
                </button>
                <button onclick="pilihKelas('65')" id="btn-65" style="--glow-color: rgba(244,63,94,0.4)" class="class-btn rounded-xl py-2 flex flex-col items-center justify-center">
                    <span class="text-xs font-black">KLS 4-5</span>
                    <span class="text-[8px] font-bold opacity-80">Bagi 65</span>
                </button>
            </div>
            <button onclick="pilihKelas('45')" id="btn-45" style="--glow-color: rgba(168,85,247,0.4)" class="class-btn w-full rounded-xl py-2 flex items-center justify-center gap-2">
                <span class="text-xs font-black tracking-widest">KELAS KODING</span>
                <span class="text-[9px] bg-black/10 px-2 py-0.5 rounded-full font-bold">Bagi 45</span>
            </button>
        </div>

        <!-- Menu Toggle (Animasi 4) -->
        <div class="flex-shrink-0 flex justify-center mb-2 anim-toggle">
            <div class="bg-white p-1 rounded-full flex gap-1 border border-slate-200 w-4/5 shadow-sm relative z-20">
                <button onclick="setMode('romawi')" id="tab-romawi" class="flex-1 py-1 rounded-full text-[11px] font-bold transition-all text-slate-500 bg-transparent">
                    ROMAWI
                </button>
                <button onclick="setMode('jumlah')" id="tab-jumlah" class="flex-1 py-1 rounded-full text-[11px] font-bold transition-all bg-amber-400 text-slate-800 shadow-md">
                    JUMLAH
                </button>
            </div>
        </div>

        <!-- Area Input (Animasi 5) -->
        <div class="flex-1 min-h-[80px] flex items-center justify-center mb-2 relative z-20 anim-input">
            
            <!-- View Romawi -->
            <div id="view-romawi" class="hidden w-full grid-cols-3 gap-2 transition-all duration-300">
                <div onclick="setFokus('r1')" id="box-r1" class="bg-white rounded-xl p-2 border-2 border-slate-200 flex flex-col items-center cursor-pointer transition-colors input-active">
                    <label class="text-[9px] font-extrabold text-blue-500 mb-0.5">ROM I (x1)</label>
                    <div id="disp-r1" class="text-2xl font-black text-slate-800 empty:after:content-['-'] empty:text-slate-300"></div>
                    <span id="max-r1" class="text-[8px] text-slate-400 mt-0.5 font-bold">Maks: ?</span>
                </div>
                <div onclick="setFokus('r2')" id="box-r2" class="bg-white rounded-xl p-2 border-2 border-slate-200 flex flex-col items-center cursor-pointer transition-colors">
                    <label id="label-r2" class="text-[9px] font-extrabold text-emerald-500 mb-0.5">ROM II (x2)</label>
                    <div id="disp-r2" class="text-2xl font-black text-slate-800 empty:after:content-['-'] empty:text-slate-300"></div>
                    <span id="max-r2" class="text-[8px] text-slate-400 mt-0.5 font-bold">Maks: ?</span>
                </div>
                <div onclick="setFokus('r3')" id="box-r3" class="bg-white rounded-xl p-2 border-2 border-slate-200 flex flex-col items-center cursor-pointer transition-colors">
                    <label class="text-[9px] font-extrabold text-rose-500 mb-0.5">ROM III (x3)</label>
                    <div id="disp-r3" class="text-2xl font-black text-slate-800 empty:after:content-['-'] empty:text-slate-300"></div>
                    <span id="max-r3" class="text-[8px] text-slate-400 mt-0.5 font-bold">Maks: ?</span>
                </div>
            </div>

            <!-- View Jumlah -->
            <div id="view-jumlah" class="w-full h-full flex items-center justify-center">
                <div onclick="setFokus('total')" id="box-total" class="bg-white rounded-xl p-1.5 w-1/2 border-2 border-amber-400 shadow-[0_0_10px_rgba(251,191,36,0.3)] text-center cursor-pointer input-active flex flex-col items-center justify-center transition-all duration-300">
                    <label class="text-[9px] font-black text-amber-500 tracking-widest uppercase mb-0.5">Total Skormu</label>
                    <div id="disp-total" class="text-3xl font-black text-slate-800 empty:after:content-['-'] empty:text-slate-300"></div>
                    <span id="max-total" class="text-[8px] text-slate-400 mt-0.5 font-bold">Maks: ?</span>
                </div>
            </div>

        </div>

        <!-- Keyboard Angka Bawaan (Animasi 6 - Numpad) -->
        <div class="flex-shrink-0 bg-white rounded-t-3xl border-t border-slate-200 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.05)] p-2 -mx-2 sm:-mx-3 h-[35dvh] min-h-[220px] relative z-30 anim-numpad">
            <div class="grid grid-cols-3 gap-1.5 h-full">
                <button onclick="tekanTombol('1')" class="numpad-btn bg-slate-50 border border-slate-100 rounded-xl text-2xl font-bold text-slate-700 transition-colors">1</button>
                <button onclick="tekanTombol('2')" class="numpad-btn bg-slate-50 border border-slate-100 rounded-xl text-2xl font-bold text-slate-700 transition-colors">2</button>
                <button onclick="tekanTombol('3')" class="numpad-btn bg-slate-50 border border-slate-100 rounded-xl text-2xl font-bold text-slate-700 transition-colors">3</button>
                
                <button onclick="tekanTombol('4')" class="numpad-btn bg-slate-50 border border-slate-100 rounded-xl text-2xl font-bold text-slate-700 transition-colors">4</button>
                <button onclick="tekanTombol('5')" class="numpad-btn bg-slate-50 border border-slate-100 rounded-xl text-2xl font-bold text-slate-700 transition-colors">5</button>
                <button onclick="tekanTombol('6')" class="numpad-btn bg-slate-50 border border-slate-100 rounded-xl text-2xl font-bold text-slate-700 transition-colors">6</button>
                
                <button onclick="tekanTombol('7')" class="numpad-btn bg-slate-50 border border-slate-100 rounded-xl text-2xl font-bold text-slate-700 transition-colors">7</button>
                <button onclick="tekanTombol('8')" class="numpad-btn bg-slate-50 border border-slate-100 rounded-xl text-2xl font-bold text-slate-700 transition-colors">8</button>
                <button onclick="tekanTombol('9')" class="numpad-btn bg-slate-50 border border-slate-100 rounded-xl text-2xl font-bold text-slate-700 transition-colors">9</button>
                
                <button onclick="tekanTombol('C')" class="numpad-btn bg-red-50 border border-red-100 rounded-xl text-xl font-black text-red-500 transition-colors">C</button>
                <button onclick="tekanTombol('0')" class="numpad-btn bg-slate-50 border border-slate-100 rounded-xl text-2xl font-bold text-slate-700 transition-colors">0</button>
                <button onclick="tekanTombol('DEL')" class="numpad-btn bg-slate-100 border border-slate-200 rounded-xl text-xl font-bold text-slate-600 transition-colors flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z" />
                    </svg>
                </button>
            </div>
        </div>

    </div>

    <script>
        // --- LOGIKA INSTALL PWA ---
        let deferredPrompt;
        
        if ('serviceWorker' in navigator) {
            // Memanggil file fisik sw.js agar lolos keamanan Browser & GitHub Pages
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Setup (Bisa diabaikan jika offline):', err));
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            setTimeout(() => {
                document.getElementById('install-banner').classList.add('show');
            }, 1500); 
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    deferredPrompt = null;
                    tutupBanner();
                });
            }
        }

        function tutupBanner() {
            document.getElementById('install-banner').classList.remove('show');
        }

        // --- LOGIKA UTAMA KALKULATOR ---
        const configKelas = {
            '55': { maxR1: 20, maxR2: 10, maxR3: 5, color: 'bg-blue-500' },
            '60': { maxR1: 25, maxR2: 10, maxR3: 5, color: 'bg-emerald-500' },
            '65': { maxR1: 30, maxR2: 10, maxR3: 5, color: 'bg-rose-500' },
            '45': { maxR1: 15, maxR2: 30, maxR3: 0, color: 'bg-purple-500' } // Koding
        };

        let activeKelas = null; 
        let activeMode = 'jumlah'; // DEFAULT JUMLAH
        let fokusInput = 'total';
        let nilaiInput = { r1: '', r2: '', r3: '', total: '' };

        // Animasi Background Pelajaran Beragam
        function initMathBg() {
            const bg = document.getElementById('mathBg');
            // Masjid, Muhammadiyah(☀️/Matahari), Garuda(🦅), KBBI(📖/Buku), IPA(🔬), Matematika(📐), PJOK(⚽), Kesenian(🎨), Koding(💻), Wayang(🎭), Hijaiyah(ا), Al Qur'an(🕋)
            const symbols = ['🕌', '☀️', '🦅', '📚', '🔬', '📐', '⚽', '🎨', '💻', '🎭', 'ا', '🕋']; 
            
            for(let i = 0; i < 10; i++) {
                let el = document.createElement('div');
                el.className = 'symbol';
                el.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                el.style.left = `${Math.random() * 100}vw`;
                el.style.animationDuration = `${12 + Math.random() * 10}s`;
                el.style.animationDelay = `-${Math.random() * 15}s`; 
                el.style.fontSize = `${2 + Math.random() * 2}rem`; // Ukuran yang lebih besar
                bg.appendChild(el);
            }
        }
        initMathBg();

        // Fungsi Membersihkan Semua Data (Reset Default)
        function resetGlobal() {
            activeKelas = null;
            document.getElementById('area-kelas').classList.remove('needs-class');
            nilaiInput = { r1: '', r2: '', r3: '', total: '' };

            // Matikan indikator semua tombol kelas
            ['55', '60', '65', '45'].forEach(k => {
                const btn = document.getElementById('btn-' + k);
                btn.className = btn.className.replace(/bg-\w+-500/g, 'bg-white');
                btn.classList.remove('class-active');
            });

            // Kembalikan struktur Romawi ke default (3 Kotak)
            const viewRomawi = document.getElementById('view-romawi');
            const boxR3 = document.getElementById('box-r3');
            const labelR2 = document.getElementById('label-r2');
            
            viewRomawi.classList.replace('grid-cols-2', 'grid-cols-3');
            boxR3.classList.remove('hidden');
            labelR2.innerText = 'ROM II (x2)'; 

            // Reset label maksimal
            document.getElementById('max-r1').innerText = 'Maks: ?';
            document.getElementById('max-r2').innerText = 'Maks: ?';
            document.getElementById('max-r3').innerText = 'Maks: ?';
            document.getElementById('max-total').innerText = 'Maks: ?';
            
            updateTampilan();
            setMode('jumlah'); // Kembali ke tampilan Jumlah secara default

            // Reset Papan Nilai Utama
            document.getElementById('nilaiAsli').innerText = '0.00';
            document.getElementById('nilaiBulat').innerText = '0';
            
            // Sembunyikan GIF
            const gifEl = document.getElementById('gif-reaction');
            gifEl.classList.remove('scale-100');
            gifEl.classList.add('scale-0');
            gifEl.innerHTML = '';
        }

        function pilihKelas(kelas) {
            activeKelas = kelas;
            
            document.getElementById('area-kelas').classList.remove('needs-class');
            nilaiInput = { r1: '', r2: '', r3: '', total: '' };

            ['55', '60', '65', '45'].forEach(k => {
                const btn = document.getElementById('btn-' + k);
                btn.className = btn.className.replace(/bg-\w+-500/g, 'bg-white');
                btn.classList.remove('class-active');
            });

            const activeBtn = document.getElementById('btn-' + kelas);
            activeBtn.classList.remove('bg-white');
            activeBtn.classList.add(configKelas[kelas].color, 'class-active');

            const viewRomawi = document.getElementById('view-romawi');
            const boxR3 = document.getElementById('box-r3');
            const labelR2 = document.getElementById('label-r2');

            if (kelas === '45') {
                viewRomawi.classList.replace('grid-cols-3', 'grid-cols-2');
                boxR3.classList.add('hidden');
                labelR2.innerText = 'ROM II (x1)'; 
                if (fokusInput === 'r3') setFokus('r2');
            } else {
                viewRomawi.classList.replace('grid-cols-2', 'grid-cols-3');
                boxR3.classList.remove('hidden');
                labelR2.innerText = 'ROM II (x2)'; 
            }

            document.getElementById('max-r1').innerText = 'Maks: ' + configKelas[kelas].maxR1;
            document.getElementById('max-r2').innerText = 'Maks: ' + configKelas[kelas].maxR2;
            if (kelas !== '45') {
                document.getElementById('max-r3').innerText = 'Maks: ' + configKelas[kelas].maxR3;
            }
            document.getElementById('max-total').innerText = 'Maks: ' + kelas;
            
            validasiNilai();
            updateTampilan();
            kalkulasi();
        }

        function setMode(mode) {
            activeMode = mode;
            const tRomawi = document.getElementById('tab-romawi');
            const tJumlah = document.getElementById('tab-jumlah');
            
            if(mode === 'romawi') {
                tRomawi.className = "flex-1 py-1 rounded-full text-[11px] font-bold transition-all bg-indigo-500 text-white shadow-md";
                tJumlah.className = "flex-1 py-1 rounded-full text-[11px] font-bold transition-all text-slate-500 bg-transparent";
                document.getElementById('view-romawi').classList.remove('hidden');
                document.getElementById('view-romawi').classList.add('grid');
                document.getElementById('view-jumlah').classList.add('hidden');
                document.getElementById('view-jumlah').classList.remove('flex');
                setFokus('r1'); 
            } else {
                tJumlah.className = "flex-1 py-1 rounded-full text-[11px] font-bold transition-all bg-amber-400 text-slate-800 shadow-md";
                tRomawi.className = "flex-1 py-1 rounded-full text-[11px] font-bold transition-all text-slate-500 bg-transparent";
                document.getElementById('view-jumlah').classList.remove('hidden');
                document.getElementById('view-jumlah').classList.add('flex');
                document.getElementById('view-romawi').classList.add('hidden');
                document.getElementById('view-romawi').classList.remove('grid');
                setFokus('total'); 
            }
            kalkulasi();
        }

        function setFokus(idBox) {
            fokusInput = idBox;
            ['r1', 'r2', 'r3', 'total'].forEach(id => {
                const el = document.getElementById('box-' + id);
                if(el) el.classList.remove('input-active');
            });
            document.getElementById('box-' + idBox).classList.add('input-active');
        }

        function tekanTombol(kunci) {
            if (!activeKelas) {
                const areaKelas = document.getElementById('area-kelas');
                areaKelas.classList.remove('needs-class');
                void areaKelas.offsetWidth; 
                areaKelas.classList.add('needs-class');
                return;
            }

            let strCurrent = nilaiInput[fokusInput];

            if (kunci === 'C') {
                strCurrent = '';
            } else if (kunci === 'DEL') {
                strCurrent = strCurrent.slice(0, -1);
            } else {
                if(strCurrent === '0' && kunci === '0') return;
                strCurrent += kunci;
            }

            nilaiInput[fokusInput] = strCurrent;
            validasiNilai();
            updateTampilan();
            kalkulasi();
        }

        function validasiNilai() {
            if(!activeKelas) return;
            const valNum = parseInt(nilaiInput[fokusInput]);
            if(isNaN(valNum)) return;

            let maxAllow = 0;
            if(fokusInput === 'r1') maxAllow = configKelas[activeKelas].maxR1;
            if(fokusInput === 'r2') maxAllow = configKelas[activeKelas].maxR2;
            if(fokusInput === 'r3') maxAllow = configKelas[activeKelas].maxR3;
            if(fokusInput === 'total') maxAllow = parseInt(activeKelas);

            if(valNum > maxAllow) {
                nilaiInput[fokusInput] = maxAllow.toString();
            }
        }

        function updateTampilan() {
            document.getElementById('disp-r1').innerText = nilaiInput.r1;
            document.getElementById('disp-r2').innerText = nilaiInput.r2;
            document.getElementById('disp-r3').innerText = nilaiInput.r3;
            document.getElementById('disp-total').innerText = nilaiInput.total;
        }

        function kalkulasi() {
            if (!activeKelas) return;

            let pembagi = parseInt(activeKelas);
            let totalSkor = 0;

            if (activeMode === 'romawi') {
                let r1 = parseInt(nilaiInput.r1) || 0;
                let r2 = parseInt(nilaiInput.r2) || 0;
                let r3 = parseInt(nilaiInput.r3) || 0;
                
                if (activeKelas === '45') {
                    totalSkor = (r1 * 1) + (r2 * 1);
                } else {
                    totalSkor = (r1 * 1) + (r2 * 2) + (r3 * 3);
                }
            } else {
                totalSkor = parseFloat(nilaiInput.total) || 0;
            }

            let nilaiAkhir = (totalSkor * 100) / pembagi;
            
            let valAsli = isNaN(nilaiAkhir) ? 0 : nilaiAkhir;
            let strAsli = valAsli.toFixed(2);
            if(strAsli.endsWith('.00')) strAsli = valAsli.toString();
            let valBulat = Math.round(valAsli);
            let strBulat = valBulat.toString();

            const elAsli = document.getElementById('nilaiAsli');
            const elBulat = document.getElementById('nilaiBulat');

            if(elAsli.innerText !== strAsli) {
                elAsli.innerText = strAsli;
                elBulat.innerText = strBulat;
                
                elAsli.classList.remove('pop-effect');
                elBulat.classList.remove('pop-effect');
                void elAsli.offsetWidth; 
                elAsli.classList.add('pop-effect');
                elBulat.classList.add('pop-effect');
            }

            const gifEl = document.getElementById('gif-reaction');

            if (totalSkor === 0 || !activeKelas) {
                gifEl.classList.remove('scale-100');
                gifEl.classList.add('scale-0');
            } else {
                gifEl.classList.remove('scale-0');
                gifEl.classList.add('scale-100');
                
                if (valBulat < 70) {
                    gifEl.innerHTML = '<img src="sedih.gif" alt="sedih" class="w-full h-full object-contain">';
                } else if (valBulat >= 70 && valBulat <= 85) {
                    gifEl.innerHTML = '<img src="senyum.gif" alt="senyum" class="w-full h-full object-contain">';
                } else if (valBulat > 85) {
                    gifEl.innerHTML = '<img src="bahagia.gif" alt="bahagia" class="w-full h-full object-contain">';
                }
            }
        }

        document.addEventListener('keydown', function(e) {
            const key = e.key;
            if (/^[0-9]$/.test(key)) {
                tekanTombol(key);
            } else if (key === 'Backspace') {
                tekanTombol('DEL');
            } else if (key.toLowerCase() === 'c' || key === 'Delete' || key === 'Escape') {
                tekanTombol('C');
            }
        });

        // Set default ke JUMLAH saat pertama dimuat
        setMode('jumlah');

    </script>
</body>
</html>
