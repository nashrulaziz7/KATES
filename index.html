<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KATES Pro - Kalkulator Tes Siswa</title>
    
    <link rel="icon" href="LOGO.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');
        html, body { width: 100%; height: 100%; position: fixed; overflow: hidden; overscroll-behavior: none; }
        body { font-family: 'Nunito', sans-serif; margin: 0; background: linear-gradient(135deg, #f0f4f8, #e2e8f0); touch-action: manipulation; }
        
        .numpad-btn { width: 100%; aspect-ratio: 2/1; display: flex; align-items: center; justify-content: center; font-weight: 800; border-radius: 0.75rem; border: 1px solid #e2e8f0; background: white; transition: all 0.1s; }
        .numpad-btn:active { background: #cbd5e1; transform: scale(0.95); }
        .class-btn { transition: all 0.2s; border: 2px solid #e2e8f0; background: #fff; }
        .class-active { border-color: #3b82f6 !important; background: #eff6ff !important; transform: scale(1.02); }
        .subject-bg { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; overflow: hidden; }
        .symbol { position: absolute; font-weight: 900; white-space: nowrap; animation: float-up linear infinite; }
        @keyframes float-up { 0% { transform: translateY(110vh) rotate(-15deg); opacity: 0; } 15% { opacity: 0.35; } 85% { opacity: 0.35; } 100% { transform: translateY(-15vh) rotate(-10deg); opacity: 0; } }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-2">

    <!-- Header -->
    <div class="w-full flex justify-between items-center px-2 z-10 pt-2">
        <button onclick="location.reload()" class="bg-blue-100 text-blue-600 px-3 py-1.5 rounded-lg text-[10px] font-black shadow-sm">REFRESH</button>
        <span class="text-[9px] font-black text-slate-400">BY ZIVI•AI</span>
        <button onclick="resetGlobal()" class="bg-rose-100 text-rose-600 px-3 py-1.5 rounded-lg text-[10px] font-black shadow-sm">RESET</button>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col items-center justify-center w-full max-w-sm gap-2 mt-2">
        <img src="JUDUL.png" alt="KATES" class="h-12 object-contain mx-auto drop-shadow-sm">
        
        <div class="w-full flex gap-2">
            <div class="flex-1 bg-white p-3 rounded-2xl border-2 border-blue-200 text-center">
                <p class="text-[8px] font-bold text-blue-500 uppercase">Nilai Asli</p>
                <div class="text-2xl font-black text-blue-700" id="nilaiAsli">0.00</div>
            </div>
            <div class="flex-1 bg-white p-3 rounded-2xl border-2 border-emerald-200 text-center">
                <p class="text-[8px] font-bold text-emerald-500 uppercase">Pembulatan</p>
                <div class="text-2xl font-black text-emerald-700" id="nilaiBulat">0</div>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-1.5 w-full" id="area-kelas">
            <button id="btn-55" class="class-btn rounded-xl py-1.5 text-[9px] font-black">KLS 1</button>
            <button id="btn-60" class="class-btn rounded-xl py-1.5 text-[9px] font-black">KLS 2-3</button>
            <button id="btn-65" class="class-btn rounded-xl py-1.5 text-[9px] font-black">KLS 4-5</button>
            <button id="btn-45" class="class-btn rounded-xl py-1.5 text-[9px] font-black text-purple-600">KODING</button>
        </div>

        <div class="w-full bg-white p-3 rounded-2xl border flex items-center justify-between">
            <select id="select-kelas-grading" class="w-[30%] text-[10px] font-black border rounded-lg p-1.5"></select>
            <select id="select-siswa" class="w-[60%] text-[10px] font-black border rounded-lg p-1.5"></select>
            <button onclick="tambahSiswaCepat()" class="bg-blue-600 text-white w-8 h-8 rounded-lg font-black">+</button>
        </div>

        <button id="btn-simpan-nilai" class="w-full bg-blue-600 text-white font-black py-3 rounded-xl text-xs shadow-lg">SIMPAN NILAI</button>
    </div>

    <!-- Keyboard Simetris -->
    <div class="w-full max-w-sm grid grid-cols-3 gap-2 pb-4 px-2 mt-auto">
        <button class="numpad-btn" data-val="1">1</button>
        <button class="numpad-btn" data-val="2">2</button>
        <button class="numpad-btn" data-val="3">3</button>
        <button class="numpad-btn" data-val="4">4</button>
        <button class="numpad-btn" data-val="5">5</button>
        <button class="numpad-btn" data-val="6">6</button>
        <button class="numpad-btn" data-val="7">7</button>
        <button class="numpad-btn" data-val="8">8</button>
        <button class="numpad-btn" data-val="9">9</button>
        <button class="numpad-btn bg-rose-50 text-rose-500" data-val="C">C</button>
        <button class="numpad-btn" data-val="0">0</button>
        <button class="numpad-btn bg-slate-100" data-val="DEL">⌫</button>
    </div>

    <script>

        function toProperCase(str) {
            return str.toLowerCase().replace(/(^|\s)\S/g, (match) => match.toUpperCase());
        }

        // Logic Tambah Siswa dengan Auto-ProperCase

            let namaProper = toProperCase(namaInput);
            // ... (lanjutkan logika simpan dengan namaProper)
        }
    </script>
</body>
</html>
